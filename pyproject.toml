[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teoria-conjuntos-toolkit"
version = "0.1.0"
description = "Librería de Python para Teoría de Conjuntos: operaciones, familias, relaciones, funciones y visualización."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["set-theory", "mathematics", "discrete-mathematics", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Education",
]
dependencies = []

[project.optional-dependencies]
graficos = ["matplotlib>=3.7", "networkx>=3.0"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
